packages:
  - apps/*
  - packages/*

# Versioni condivise tra i package del workspace.
# Vincoli verificati (novembre 2026):
#  - typescript-eslint supporta TypeScript <6.1  -> TypeScript 6.0.x (non 7.x)
#  - vitest 4.1.x: scelta prudente (il plugin Cloudflare accetta anche la 5.x, non ancora provata)
allowBuilds:
  esbuild: true
  workerd: true

catalog:
  typescript: 6.0.3
  vitest: 4.1.12
  zod: 4.6.7
  drizzle-orm: 0.45.4
  hono: 4.13.16
  '@cloudflare/workers-types': 5.20261103.1
  '@types/node': ^22.0.0
